<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="64" height="64" rx="16" fill="#0A0B10" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Headphones arc -->
  <path d="M18 34 C18 22 24 16 32 16 C40 16 46 22 46 34" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#neonBlur)" />
  
  <!-- Left earcup -->
  <rect x="14" y="32" width="7" height="14" rx="3.5" fill="#00B4FF" filter="url(#neonBlur)" />
  <!-- Right earcup -->
  <rect x="43" y="32" width="7" height="14" rx="3.5" fill="#8B5CF6" filter="url(#neonBlur)" />
  
  <!-- Central Sound Waves -->
  <line x1="28" y1="36" x2="28" y2="42" stroke="#00B4FF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="33" x2="32" y2="45" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="36" y1="36" x2="36" y2="42" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round" />
</svg>
